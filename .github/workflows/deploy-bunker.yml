name: Deploy Bunker
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            substituters = https://cache.andrewyazura.com/main?priority=30 https://cache.nixos.org?priority=40
            trusted-public-keys = main:3p3SLFLPh7NUwZ/1940Ez5F3DX/LmMOfJeWSoMaSgxI= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TAILSCALE_AUDIENCE }}
          tags: tag:ci
          ping: ${{ secrets.BUNKER_HOST }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH for bunker
        run: |
          echo "${{ secrets.BUNKER_HOST }} $(cat hosts/bunker/ssh_host_ed25519_key.pub)" >> ~/.ssh/known_hosts
          printf 'Host bunker\n  HostName %s\n  StrictHostKeyChecking yes\n' "${{ secrets.BUNKER_HOST }}" >> ~/.ssh/config

      - name: Setup Attic
        uses: ryanccn/attic-action@dc99f5eb1d5c0495aa26f7b56337b30011fa153e # v0.5.2
        with:
          endpoint: https://cache.andrewyazura.com
          cache: main
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Check if bunker config changed
        id: check
        if: github.event_name == 'push'
        run: |
          ATTR="nixosConfigurations.bunker.config.system.build.toplevel"
          OLD_DRV=$(nix eval --raw ".?rev=${{ github.event.before }}#${ATTR}.drvPath" 2>/dev/null) || OLD_DRV="unknown"
          NEW_DRV=$(nix eval --raw ".#${ATTR}.drvPath")
          if [[ "$OLD_DRV" == "$NEW_DRV" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Bunker config unchanged — skipping deploy"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Bunker config changed — will deploy"
          fi

      - name: Build bunker config
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.changed == 'true'
        run: nix build .#nixosConfigurations.bunker.config.system.build.toplevel

      - name: Deploy to bunker
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.changed == 'true'
        run: nix run .#deploy-rs -- .#bunker --ssh-user deploy --skip-checks
