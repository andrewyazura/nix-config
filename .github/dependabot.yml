version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: cron
      cronjob: 0 9 */2 * *
    groups:
      flake-inputs:
        pattern:
          - "*"
